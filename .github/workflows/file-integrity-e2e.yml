name: File Integrity E2E

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  file-integrity-e2e:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    name: Python client file integrity (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout repository
        # v5
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Install E2E dependencies
        uses: validityBase/vbase-github-actions/.github/actions/setup-python-deps@v1
        with:
          requirements-files: |
            requirements/e2e.txt
          python-version: "3.12"
          require-hashes: "true"

      - name: Install package
        run: python -m pip install --no-deps --no-build-isolation -e .

      - name: Run file-integrity E2E tests
        uses: validityBase/vbase-github-actions/.github/actions/run-with-bitwarden-env@863526aeff6dce34a0cf242d2c7649a8f2a01510
        with:
          bitwarden-access-token: ${{ secrets.VBASE_DJANGO_TOOLS_CYPRESS_RUNNER_STG_TOKEN }}
          vbase-common-repo-read-token: ${{ secrets.VBASE_COMMON_REPO_READ_TOKEN }}
          project: vbase-django-tools-cypress-runner-stg
          vbase-common-ref: 9957845c46dee23348f1bdd67c4f554f225ff55b
          command: python -m unittest discover -s tests -v
