name: Reusable File Integrity E2E

on:
  workflow_call:
    inputs:
      install-source:
        description: Package install source (source, artifact, or pypi).
        type: string
        required: true
      release-tag:
        description: Release tag for candidate artifacts or an exact PyPI version.
        type: string
        required: false
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  file-integrity-e2e:
    name: ${{ inputs.install-source }} file integrity
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
        install_source: ["${{ inputs.install-source }}"]
        # GitHub Actions augments each base os/install_source combination with
        # the matching os-specific api_key_secret instead of adding extra jobs.
        include:
          - os: ubuntu-24.04
            api_key_secret: FILE_INTEGRITY_E2E_VBASE_API_KEY_UBUNTU
          - os: macos-latest
            api_key_secret: FILE_INTEGRITY_E2E_VBASE_API_KEY_MACOS
          - os: windows-latest
            api_key_secret: FILE_INTEGRITY_E2E_VBASE_API_KEY_WINDOWS

    steps:
      - name: Checkout repository
        # v5
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ inputs.release-tag && format('refs/tags/{0}', inputs.release-tag) || github.sha }}

      - name: Install E2E dependencies
        uses: validityBase/vbase-github-actions/.github/actions/setup-python-deps@v1
        with:
          requirements-files: |
            requirements/e2e.txt
          python-version: "3.12"
          require-hashes: "true"

      - name: Install package from source
        if: ${{ matrix.install_source == 'source' }}
        run: python -m pip install --no-deps --no-build-isolation -e .

      - name: Download candidate distributions
        if: ${{ matrix.install_source == 'artifact' }}
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: python-package-distributions
          path: ${{ runner.temp }}/candidate-dist

      - name: Install candidate distribution
        if: ${{ matrix.install_source == 'artifact' }}
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
          CANDIDATE_DIST_DIR: ${{ runner.temp }}/candidate-dist
        shell: bash
        run: |
          python -m pip install --no-index --no-deps --only-binary=:all: --find-links "$CANDIDATE_DIST_DIR" "vbase-api==${RELEASE_TAG#v}"

      - name: Install package from PyPI
        if: ${{ matrix.install_source == 'pypi' }}
        # Intentionally resolve dependencies from PyPI to test the published
        # package the same way users install it.
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        shell: bash
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            python -m pip install --upgrade --no-cache-dir "vbase-api==${RELEASE_TAG#v}"
          else
            python -m pip install --upgrade vbase-api
          fi

      - name: Validate live E2E secrets
        env:
          MATRIX_OS: ${{ matrix.os }}
          VBASE_API_KEY: ${{ secrets[matrix.api_key_secret] }}
          VBASE_API_KEY_SECRET_NAME: ${{ matrix.api_key_secret }}
          S3_VALIDATION_BUCKET: ${{ secrets.S3_VALIDATION_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          missing=()
          if [ -z "${VBASE_API_KEY:-}" ]; then
            printf '::error::Missing live E2E secret for %s: %s\n' "$MATRIX_OS" "$VBASE_API_KEY_SECRET_NAME"
            missing+=("VBASE_API_KEY")
          fi

          for secret_name in \
            S3_VALIDATION_BUCKET \
            AWS_ACCESS_KEY_ID \
            AWS_SECRET_ACCESS_KEY
          do
            if [ -z "${!secret_name:-}" ]; then
              missing+=("$secret_name")
            fi
          done

          if [ "${#missing[@]}" -ne 0 ]; then
            printf '::error::Missing live E2E secret: %s\n' "${missing[@]}"
            exit 1
          fi

      - name: Run app API compatibility and file-integrity E2E tests
        env:
          VBASE_API_PACKAGE_SOURCE: ${{ matrix.install_source }}
          VBASE_API_KEY: ${{ secrets[matrix.api_key_secret] }}
          BASE_URL: ${{ vars.BASE_URL }}
          S3_VALIDATION_BUCKET: ${{ secrets.S3_VALIDATION_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: python -m unittest discover -s tests -p 'test_*_e2e.py' -v
