name: Prepare release
'on':
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment (major for breaking changes)
        type: choice
        required: true
        options:
        - patch
        - minor
        - major
permissions:
  contents: write
  pull-requests: write
jobs:
  prepare:
    uses: validityBase/vbase-github-actions/.github/workflows/prepare-python-release.yml@62d57fc9eaaf2e8b6d341ec78c8c3409e8cda183
    with:
      version-file: src/vbase_api/_version.py
      release-tools-ref: 62d57fc9eaaf2e8b6d341ec78c8c3409e8cda183
      bump: ${{ inputs.bump }}
