name: Prepare release
'on':
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment (major for breaking changes)
        type: choice
        required: true
        options:
        - patch
        - minor
        - major
permissions:
  contents: write
  pull-requests: write
jobs:
  prepare:
    uses: validityBase/vbase-github-actions/.github/workflows/prepare-python-release.yml@86ade940b9980dc465f0071c24146545bcb67344
    with:
      version-file: src/vbase_api/_version.py
      release-tools-ref: 86ade940b9980dc465f0071c24146545bcb67344
      bump: ${{ inputs.bump }}
