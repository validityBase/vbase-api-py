name: Prepare release
'on':
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment (major for breaking changes)
        type: choice
        required: true
        options:
        - patch
        - minor
        - major
permissions:
  contents: write
  pull-requests: write
jobs:
  prepare:
    uses: validityBase/vbase-github-actions/.github/workflows/prepare-python-release.yml@24bce39c7e11510238b189ee14abcdf7e129aae6
    with:
      version-file: src/vbase_api/_version.py
      release-tools-ref: 24bce39c7e11510238b189ee14abcdf7e129aae6
      bump: ${{ inputs.bump }}
