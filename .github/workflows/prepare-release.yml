name: Prepare release
'on':
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment (major for breaking changes)
        type: choice
        required: true
        options:
        - patch
        - minor
        - major
permissions:
  contents: write
  pull-requests: write
jobs:
  prepare:
    uses: validityBase/vbase-github-actions/.github/workflows/prepare-python-release.yml@87ddbdef4c28f1a702e3b358b2a1b6659919960c
    with:
      version-file: src/vbase_api/_version.py
      release-tools-ref: 87ddbdef4c28f1a702e3b358b2a1b6659919960c
      bump: ${{ inputs.bump }}
