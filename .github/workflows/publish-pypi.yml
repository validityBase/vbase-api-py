name: Publish Python Package to PyPI

on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
  workflow_dispatch: # Select an existing release tag, never a branch.

concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  # upload-artifact needs Actions API write when permissions are explicit
  actions: write

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-24.04

    steps:
      - name: Require a release tag
        env:
          REF_TYPE: ${{ github.ref_type }}
        run: test "$REF_TYPE" = tag

      # v5
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0

      - name: Require a commit merged to main
        run: git merge-base --is-ancestor HEAD origin/main

      - name: Set up Python
        # v6
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Validate release tag, version, and changelog
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python internal/scripts/validate_release.py --tag "$RELEASE_TAG"

      - name: Install build dependencies
        run: python -m pip install --upgrade build twine

      - name: Build package
        run: python -m build

      - name: Check distributions
        run: python -m twine check dist/*

      - name: Validate distribution versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python internal/scripts/validate_release.py --tag "$RELEASE_TAG" --dist-dir dist

      - name: Store the distribution packages
        # v6
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: python-package-distributions
          path: dist/

  publish-to-pypi:
    name: Publish to PyPI
    needs:
      - build
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/vbase-api
    permissions:
      # id-token: trusted publishing to PyPI (OIDC)
      id-token: write
      # download-artifact needs Actions API read when job-level permissions are set
      actions: read

    steps:
      - name: Download all the dists
        # v6
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distribution to PyPI
        # release/v1
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b

  github-release:
    name: Create GitHub Release
    needs: publish-to-pypi
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # v5
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Set up Python
        # v6
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Create release from changelog
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python internal/scripts/validate_release.py --tag "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
