name: Publish Python Package to PyPI
'on':
  push:
    tags:
    - v[0-9]*.[0-9]*.[0-9]*
  workflow_dispatch: null
concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
  actions: write
jobs:
  build:
    uses: validityBase/vbase-github-actions/.github/workflows/build-python-release.yml@24bce39c7e11510238b189ee14abcdf7e129aae6
    with:
      version-file: src/vbase_api/_version.py
      release-tools-ref: 24bce39c7e11510238b189ee14abcdf7e129aae6
      package-name: vbase-api
  publish-to-pypi:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/vbase-api
    permissions:
      id-token: write
      actions: read
    steps:
    - uses: validityBase/vbase-github-actions/.github/actions/publish-python-release@24bce39c7e11510238b189ee14abcdf7e129aae6
  github-release:
    needs: publish-to-pypi
    permissions:
      contents: write
      actions: read
    uses: validityBase/vbase-github-actions/.github/workflows/github-python-release.yml@24bce39c7e11510238b189ee14abcdf7e129aae6
