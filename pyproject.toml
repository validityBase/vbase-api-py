[build-system]
requires = ["setuptools >= 62.6"]
build-backend = "setuptools.build_meta"

[project]
name = "vbase-api"          # This is the name on PyPI
dynamic = ["version", "dependencies"]
description = "vBase REST API Python Client"
readme = "README.md"
requires-python = ">=3.8"
# Python 3.8-compatible setuptools needs the legacy license table.
license = {text = "Apache-2.0"}
authors = [
  { name = "vBase", email = "tech@vbase.com" }
]

keywords = ["vbase", "stamping", "web3", "blockchain", "validation"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/validityBase/vbase-api-py"
Documentation = "https://docs.vbase.com/"

# This tells setuptools where to find the code
[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "vbase_api._version.__version__"}
dependencies = {file = ["requirements.in"]}
